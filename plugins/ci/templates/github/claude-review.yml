name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR by applying the PROJECT RULES, not generic advice:
            1. First read docs/CODEMAP.md (coupling rules, gotchas) and the
               accepted ADRs in docs/adr/.
            2. Review the diff: correctness, compliance with coupling rules,
               security (secrets, injections), unjustified complexity (YAGNI).
            3. Post your findings as inline comments (severity Blocking /
               Important / Minor, with a concrete suggestion every time).
            4. End with a short summary comment. If nothing to report: say so.
          claude_args: "--allowedTools 'Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment'"
